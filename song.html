<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Song</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #eef4ff;
      padding: 2rem;
      text-align: center;
      color: #333;
    }
    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #2f5cff;
    }
    iframe {
      margin-top: 2rem;
      border-radius: 8px;
      width: 100%;
      height: 420px;
      border: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    .back-button {
      display: inline-block;
      margin: 2rem 0;
      padding: 12px 24px;
      background: linear-gradient(135deg, #2f5cff, #1e40ff);
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 6px 12px rgba(47,92,255,0.4);
      transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
      user-select: none;
    }
    .back-button:hover,
    .back-button:focus {
      background: linear-gradient(135deg, #1e40ff, #1530cc);
      box-shadow: 0 8px 18px rgba(47,92,255,0.55);
      transform: scale(1.05);
      outline: none;
    }
    .back-button:active {
      transform: scale(0.95);
    }
    .footer {
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Dedicated Song</h1>
  <iframe
    src="https://www.youtube.com/embed/OQWHFmPDVRg?si=MujEyQcb3EXOCJMT"
    title="love."
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
  <div class="footer">
    <a href="home.html" class="back-button">← Back to Home</a>
  </div>
</body>
</html>
